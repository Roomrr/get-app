<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Get the Roomrr app</title>
  <meta name="description" content="Download Roomrr for Android or iPhone, or continue on the website." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon-192.png" />
  <link rel="apple-touch-icon" href="favicon-192.png" />
  <meta name="theme-color" content="#fdf3ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)" />

  <script>
    /* ---------------------------------------------------------------------
       Store links. Edit these three lines only.
       appStore is the live Roomrr iOS listing (id6789584593).
       --------------------------------------------------------------------- */
    var LINKS = {
      play: 'https://play.google.com/store/apps/details?id=com.roomrr.app&referrer=utm_source%3Dqr%26utm_medium%3Dget-app',
      appStore: 'https://apps.apple.com/in/app/roomrr/id6789584593',
      website: 'https://roomrr.com/'
    };

    /* Send phones straight to their store. Anything else stays on this page.
       Add ?stay to the URL to see the page on a phone without being sent on. */
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      // iPadOS 13+ reports itself as a Mac; touch points give it away.
      var isIOS = /iphone|ipad|ipod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var stay = /[?&]stay\b/.test(location.search);
      var target = stay ? '' : isAndroid ? LINKS.play : isIOS ? LINKS.appStore : '';
      window.__ROOMRR_OS = isAndroid ? 'android' : isIOS ? 'ios' : 'other';
      if (target) {
        document.documentElement.className += ' redirecting';
        location.replace(target);
      }
    })();
  </script>

  <style>
    @font-face { font-family: 'Manrope'; src: url('fonts/manrope-medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Manrope'; src: url('fonts/manrope-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Manrope'; src: url('fonts/manrope-extrabold.woff2') format('woff2'); font-weight: 800; font-display: swap; }

    :root {
      --ink: #191919;
      --soft: #565c6e;
      --bg: #fdf3ea;
      --card: #ffffff;
      --line: #f2e7dc;
      --btn: #191919;
      --btn-ink: #ffffff;
      --brand: linear-gradient(135deg, #e84b19, #fc9b04);
      --shadow: 0 18px 50px rgba(120, 66, 28, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f6f3ef;
        --soft: #aaa49b;
        --bg: #0f0e0c;
        --card: #181613;
        --line: rgba(255, 255, 255, .1);
        --btn: #f6f3ef;
        --btn-ink: #0f0e0c;
        --shadow: 0 18px 50px rgba(0, 0, 0, .5);
      }
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(120% 60% at 50% 0%, rgba(252, 155, 4, .14), transparent 70%);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 28px 28px;
      text-align: center;
    }

    .logo { width: 104px; height: auto; display: block; margin: 0 auto 20px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
    h1 span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { color: var(--soft); font-size: 15px; line-height: 1.55; font-weight: 500; margin: 10px auto 28px; max-width: 30ch; }

    .stores { display: grid; gap: 12px; }
    .store {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      border-radius: 16px;
      background: var(--btn); color: var(--btn-ink);
      text-decoration: none; text-align: left;
      transition: transform .15s ease, opacity .15s ease;
    }
    .store:hover { opacity: .92; }
    .store:active { transform: scale(.98); }
    .store:focus-visible, .web:focus-visible { outline: 3px solid #fc9b04; outline-offset: 3px; }
    .store svg { width: 28px; height: 28px; flex: none; }
    .store small { display: block; font-size: 11px; font-weight: 500; opacity: .75; letter-spacing: .02em; }
    .store strong { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }

    .or { display: flex; align-items: center; gap: 12px; color: var(--soft); font-size: 13px; font-weight: 500; margin: 22px 0; }
    .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .web {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 18px; border-radius: 16px;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: 16px; text-decoration: none;
      transition: transform .15s ease, opacity .15s ease;
    }
    .web:hover { opacity: .92; }
    .web:active { transform: scale(.98); }
    .web svg { width: 18px; height: 18px; }

    .status {
      display: none;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--soft); font-size: 14px; font-weight: 500;
      margin: -12px 0 22px;
    }
    .redirecting .status { display: flex; }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: #fc9b04;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .store, .web { transition: none; } }

    footer { margin-top: 22px; font-size: 12px; color: var(--soft); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" width="426" height="211" alt="Roomrr" />
    <h1>Get <span>Roomrr</span></h1>
    <p class="lede">Find a room, and the people to share it with.</p>

    <p class="status" role="status"><span class="spinner" aria-hidden="true"></span><span id="status-text">Opening the store…</span></p>

    <div class="stores">
      <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.roomrr.app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l.1.1L13.8 12v-.2L3.7 1.7l-.1.1z"/><path fill="#FBBC04" d="M17.2 15.4 13.8 12v-.2l3.4-3.4.1.1 4 2.3c1.1.6 1.1 1.7 0 2.3l-4 2.3h-.1z"/><path fill="#EA4335" d="M17.3 15.3 13.8 11.9 3.6 22.1c.4.4 1 .4 1.7.1l12-6.9"/><path fill="#4285F4" d="M17.3 8.5 5.3 1.6c-.7-.4-1.3-.3-1.7.1l10.2 10.2 3.5-3.4z"/></svg>
        <span><small>GET IT ON</small><strong>Google Play</strong></span>
      </a>
      <a class="store" id="appstore" href="https://apps.apple.com/in/app/roomrr/id6789584593">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-4.2zM13.9 4.9c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>
        <span><small>Download on the</small><strong>App Store</strong></span>
      </a>
    </div>

    <div class="or">or</div>

    <a class="web" id="website" href="https://roomrr.com/">
      Continue on the website
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <footer>&copy; <span id="year">2026</span> Roomrr</footer>
  </main>

  <script>
    // Buttons use the same links as the auto-redirect above.
    document.getElementById('play').href = LINKS.play;
    document.getElementById('appstore').href = LINKS.appStore;
    document.getElementById('website').href = LINKS.website;
    document.getElementById('year').textContent = new Date().getFullYear();
    if (window.__ROOMRR_OS === 'android') document.getElementById('status-text').textContent = 'Opening Google Play…';
    if (window.__ROOMRR_OS === 'ios') document.getElementById('status-text').textContent = 'Opening the App Store…';
    // If someone comes back from the store, show the plain page again.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) document.documentElement.classList.remove('redirecting');
    });
  </script>
</body>
</html>
